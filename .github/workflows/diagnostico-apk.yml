name: Diagnóstico APK (temporal)
on:
  push:
    branches: [diagnostico-apk]
permissions:
  actions: read
  contents: read
jobs:
  emulador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avance-de-obra-1
          run-id: 39704448780
          github-token: ${{ github.token }}
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r apk/app-release.apk
            adb logcat -c
            adb shell monkey -p py.com.tecnoedil.avanceobra -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > logcat.txt || true
            grep -n -E "FATAL|AndroidRuntime|ReactNativeJS|Error|Exception" logcat.txt | head -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
