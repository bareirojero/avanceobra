# Despliegue en Render (render.com > New > Blueprint > este repositorio).
# Los valores con sync: false se cargan a mano en Render y nunca están acá.
services:
  - type: web
    name: avance-obra-api
    runtime: docker
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    plan: free
    region: virginia
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALMACEN
        value: s3
      - key: S3_REGION
        value: auto
      - key: JWT_SECRETO
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: API_URL_PUBLICA
        sync: false
      # Cloudflare R2 (ver docs/DESPLIEGUE.md, paso 1)
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # Panel web (apps/web). API_URL_INTERNA se lee al compilar: cargala antes del
  # primer despliegue con la URL de avance-obra-api (ej. https://avance-obra-api.onrender.com).
  - type: web
    name: avance-obra-web
    runtime: node
    plan: free
    region: virginia
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @registro-obra/web build
    startCommand: pnpm --filter @registro-obra/web start
    autoDeploy: true
    envVars:
      - key: API_URL_INTERNA
        sync: false
